name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone Steinberg VST3 SDK
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DVST3_SDK_ROOT="$PWD/external/vst3sdk" `
            -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --target JerzyTapeDelay --parallel
          cmake --build build --config Release --target JerzyTapeDrive --parallel

      - name: Collect VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $delay = Get-ChildItem -Path build -Recurse -Directory -Filter "JerzyTapeDelay.vst3" | Select-Object -First 1
          if (-not $delay) { throw "JerzyTapeDelay.vst3 was not produced" }
          Copy-Item -Recurse -Force $delay.FullName artifact/JerzyTapeDelay.vst3
          Compress-Archive -Path artifact/JerzyTapeDelay.vst3 -DestinationPath JerzyTapeDelay_Windows_x64.zip -Force

          $drive = Get-ChildItem -Path build -Recurse -Directory -Filter "JerzyTapeDrive.vst3" | Select-Object -First 1
          if (-not $drive) { throw "JerzyTapeDrive.vst3 was not produced" }
          Copy-Item -Recurse -Force $drive.FullName artifact/JerzyTapeDrive.vst3
          Compress-Archive -Path artifact/JerzyTapeDrive.vst3 -DestinationPath JerzyTapeDrive_Windows_x64.zip -Force

      - name: Upload Tape Delay
        uses: actions/upload-artifact@v4
        with:
          name: JerzyTapeDelay-Windows-x64
          path: |
            artifact/JerzyTapeDelay.vst3
            JerzyTapeDelay_Windows_x64.zip
          if-no-files-found: error

      - name: Upload Tape Drive
        uses: actions/upload-artifact@v4
        with:
          name: JerzyTapeDrive-Windows-x64
          path: |
            artifact/JerzyTapeDrive.vst3
            JerzyTapeDrive_Windows_x64.zip
          if-no-files-found: error
