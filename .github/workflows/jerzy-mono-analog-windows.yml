name: Build Jerzy Mono Analog VST3

on:
  workflow_dispatch:
  push:
    branches:
      - jerzy-mono-analog-vst
    paths:
      - 'JerzyMonoAnalog/**'
      - '.github/workflows/jerzy-mono-analog-windows.yml'

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S JerzyMonoAnalog -B JerzyMonoAnalog/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build JerzyMonoAnalog/build --config Release --parallel

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "JerzyMonoAnalog/build" -Recurse -Directory -Filter "Jerzy Mono Analog.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "Nie znaleziono Jerzy Mono Analog.vst3" }
          "plugin_path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "VST3: $($plugin.FullName)"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerzy-Mono-Analog-Windows-VST3
          path: ${{ steps.locate.outputs.plugin_path }}
          if-no-files-found: error
          retention-days: 30
