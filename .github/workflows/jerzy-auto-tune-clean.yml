name: Build JERZY AUTO TUNE 1.2 (Windows)

on:
  push:
    branches:
      - jerzy-auto-tune-clean-20261002
    paths:
      - 'JerzyAutoTune/**'
      - '.github/workflows/jerzy-auto-tune-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure clean x64 Release build
        run: cmake -S JerzyAutoTune -B build/JerzyAutoTune -A x64

      - name: Build VST3
        run: cmake --build build/JerzyAutoTune --config Release --target JerzyAutoTune_VST3

      - name: Verify editor and DSP are present
        shell: pwsh
        run: |
          $plugin = 'build/JerzyAutoTune/JerzyAutoTune_artefacts/Release/VST3/JERZY AUTO TUNE.vst3'
          $moduleInfo = Get-Content "$plugin/Contents/Resources/moduleinfo.json" -Raw
          if ($moduleInfo -notmatch '"Name":\s*"JERZY AUTO TUNE"' -or $moduleInfo -notmatch '"Version":\s*"1\.2\.0"') {
            throw 'VST3 module name or version is incorrect.'
          }
          $binary = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes("$plugin/Contents/x86_64-win/JERZY AUTO TUNE.vst3"))
          foreach ($requiredText in @('JERZY AUTO TUNE', 'NOTE FILTER', 'NOISE FILTER', 'DE-ESSER', 'SATURATION', 'DOUBLER', 'VOCAL COMPRESSOR + LIMITER', 'VOCAL EQ', 'Gate Threshold', 'De-Esser Frequency', 'Limiter Ceiling')) {
            if (-not $binary.Contains($requiredText)) { throw "Built VST3 is missing expected UI/parameter string: $requiredText" }
          }

      - name: Package VST3
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/JerzyAutoTune/JerzyAutoTune_artefacts/Release/VST3/JERZY AUTO TUNE.vst3' -DestinationPath 'JERZY-AUTO-TUNE-1.2-Windows-x64-VST3.zip' -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERZY-AUTO-TUNE-1.2-Windows-x64-VST3
          path: JERZY-AUTO-TUNE-1.2-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 14
